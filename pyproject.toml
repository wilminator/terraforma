[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terraforma"
version = "0.1.0"
description = "The TerraForma RPG Engine: build a browser RPG as a module of content and rules"
readme = "README.md"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
authors = [{ name = "Michael Allen Wilmes" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pydantic>=2.9",
    "alembic>=1.14",
    "aiosmtplib>=3.0",
    "cryptography>=43",
]

[project.optional-dependencies]
# One driver per database the engine supports.
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.30"]
mysql = ["aiomysql>=0.2"]
all-databases = ["terraforma[sqlite,postgres,mysql]"]
# For tests, the engine's and a game's (terraforma.testing).
testing = ["pytest>=8.3", "pytest-xdist>=3.6", "httpx2"]
dev = [
    "terraforma[all-databases,testing]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terraforma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --dist worksteal"
# A test stuck for two minutes dumps every thread's stack, so a hang names itself instead of waiting forever.
faulthandler_timeout = 120
