[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terraforma"
version = "0.1.0"
description = "TerraFroma RPG engine, and Vanguard Tavern, the first game on it"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pydantic>=2.9",
    "alembic>=1.14",
]

[project.optional-dependencies]
# One driver per database the engine supports.
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.30"]
mysql = ["aiomysql>=0.2", "cryptography>=43"]
all-databases = ["terraforma[sqlite,postgres,mysql]"]
dev = [
    "terraforma[all-databases]",
    "pytest>=8.3",
    "httpx2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terraforma", "src/vanguard_tavern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
