[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terraforma"
version = "0.1.0"
description = "The TerraForma RPG Engine: build a browser RPG as a module of content and rules"
readme = "README.md"
license-files = ["LICENSE", "LICENSE-EXCEPTION.md"]
authors = [{ name = "Michael Allen Wilmes" }]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.14",
    "Framework :: FastAPI",
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.36",
    "argon2-cffi>=23.1",
    "itsdangerous>=2.2",
    "pydantic>=2.9",
    "alembic>=1.14",
    "aiosmtplib>=3.0",
    "cryptography>=43",
]

[project.optional-dependencies]
# One driver per database the engine supports.
sqlite = ["aiosqlite>=0.20"]
postgres = ["asyncpg>=0.30"]
mysql = ["aiomysql>=0.2"]
all-databases = ["terraforma[sqlite,postgres,mysql]"]
# For tests, the engine's and a game's (terraforma.testing).
testing = ["pytest>=8.3", "pytest-xdist>=3.6", "httpx2"]
# The browser tests (tests/e2e). The browser itself comes with `playwright install chromium`.
browser = ["playwright>=1.56"]
dev = [
    "terraforma[all-databases,testing,browser]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/terraforma"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --dist worksteal"
# A test stuck for two minutes dumps every thread's stack, so a hang names itself instead of waiting forever.
faulthandler_timeout = 120
markers = [
    "db: runs against a database (once per database under test); the rest need none",
    "accounts: category, see tests/conftest.py",
    "platform: category, see tests/conftest.py",
    "heroes: category, see tests/conftest.py",
    "fights: category, see tests/conftest.py",
    "social: category, see tests/conftest.py",
    "e2e: runs in a real browser against a live server (tests/e2e); CI runs these as their own jobs",
    "uncategorized: a test file missing from CATEGORIES in tests/conftest.py (CI would not run it)",
]
