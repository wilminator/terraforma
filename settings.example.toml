# Copy to settings.toml (never commit that one) and fill in.

# postgresql+asyncpg://..., mysql+aiomysql://... or sqlite+aiosqlite:///path.db
database_url = "postgresql+asyncpg://terraforma:terraforma@postgres/terraforma"

# Signs the login cookie. At least 32 random characters, e.g.
#   python -c "import secrets; print(secrets.token_urlsafe(48))"
session_secret = "change me to a long random string, 32 characters or more"

# HTTPS only. Set to false only for local development over plain http.
secure_cookies = false

# The address players reach the game at: links in emails start with it.
public_url = "http://localhost:8000"

# Where the encryption key files are (mounted into the container).
key_dir = "keys"

# How often the server looks for fights whose round time has run out, in seconds.
# fight_timer_seconds = 1.0

# How often the server tidies up what has gone stale (finished rate-limit windows, say), in seconds.
# housekeeping_seconds = 3600.0

# How long a held drop (need/want roll, hand-out) waits for its players before housekeeping settles it with the answers
# so far (nobody answered: it is left unclaimed), in seconds. 0 means it waits for ever.
# pending_drop_timeout_seconds = 0

# Housekeeping removes closed ballots (with their votes) and answered or dismissed rating prompts older than
# this many days. 0 keeps them for good, which is the default.
# ballot_retention_days = 0
# rating_prompt_retention_days = 0

# Chat messages (and settled flags) older than this many days are removed; a flagged message nobody has settled is kept.
# 0 keeps them for good.
# chat_retention_days = 7

# Voice through Discord (optional): a bot in your Discord server makes a voice channel for a party or alliance when a member asks, and the
# player gets a single-use invite link. The bot needs Manage Channels and Create Instant Invite. Set both, or voice is off.
# discord_bot_token = ""
# discord_guild_id = ""
# Voice channels the bot made are removed this many hours after they were made.
# voice_room_hours = 24

# A game that sells Challenge Tokens sets this (at least 32 characters). Its own backend then credits purchases with
# POST /api/server/challenge/purchase, sending "Authorization: Bearer <this secret>". Empty or absent: the call is off.
# challenge_purchase_secret = ""

# Sites that may sign players in with their game account (the engine as an OpenID Connect provider, for the store).
# Leave this out and the provider is off. See README, "The engine as a sign-in provider".
# [[oidc_clients]]
# client_id = "store"
# client_secret = "at least 32 random characters"
# redirect_uris = ["https://store.example.com/callback"]
# name = "The store"

# A game whose store grants Challenge Tokens and items sets this (at least 32 characters). The store's backend then calls
# POST /api/server/store/grant, sending "Authorization: Bearer <this secret>". Empty or absent: the call is off.
# store_grant_secret = ""

# Outgoing mail. Leave this section out for development: messages are then
# written as .eml files to outbox_dir (default "outbox") instead of sent.
# Cloudflare: port 465 with implicit TLS; the API key is both username and password.
# [mail]
# host = "smtp.example.com"
# port = 465
# implicit_tls = true
# username = "your API key"
# password = "your API key"
# from_address = "Vanguard Tavern <noreply@example.com>"

# Sign in with an OpenID Connect provider (Google, Microsoft, ...). One section per provider; leave them out for no external
# sign-in. Register <public_url>/api/external/<name>/callback as the redirect address at the provider.
# [[external_providers]]
# name = "google"                           # lowercase letters, digits, _ and -
# label = "Google"                          # what the button says
# issuer = "https://accounts.google.com"    # its settings are read from <issuer>/.well-known/openid-configuration
# client_id = "..."
# client_secret = "..."
# scopes = ["openid", "email"]              # the default; both are required

# Facebook: create an app with Facebook Login, add the redirect address above as a valid OAuth redirect URI, and use its app id
# and secret. Facebook gives an email address only when the person has a confirmed one, and that is what the account gets.
# [[external_providers]]
# name = "facebook"
# label = "Facebook"
# kind = "facebook"
# client_id = "the app id"
# client_secret = "the app secret"

# Steam needs no keys. It gives no email address, so a player signs in with it only after linking it (from the account page) to an
# account made another way.
# [[external_providers]]
# name = "steam"
# label = "Steam"
# kind = "steam"
