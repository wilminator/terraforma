name: Install the browser for the browser tests
description: Chromium for Playwright, with the system libraries it needs, cached by Playwright's version. Run the setup action first.
runs:
  using: composite
  steps:
    - name: Find Playwright's version
      id: playwright
      run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@v5
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
    - name: Install Chromium
      run: playwright install --with-deps chromium
      shell: bash
