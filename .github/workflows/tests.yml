# Every push and pull request: the test suite as small jobs that run side by side, so a failure names
# where it is. One dimension is the database (none, SQLite, Postgres, MySQL), the other the category
# of test (tests/conftest.py lists which file is in which). Tests that need no database run once, in
# "no database"; each database runs only the tests that use one.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  no-database:
    name: no database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pytest -n auto -m "not db"

  sqlite:
    name: sqlite (${{ matrix.category }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [accounts, platform, heroes, fights, social]
    env:
      TERRAFORMA_TEST_DATABASES: "sqlite+aiosqlite:///{tmp}/test.db"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pytest -n auto -m "db and ${{ matrix.category }}"

  postgres:
    name: postgres (${{ matrix.category }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [accounts, platform, heroes, fights, social]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: terraforma
          POSTGRES_PASSWORD: terraforma
          POSTGRES_DB: terraforma_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U terraforma"
          --health-interval 2s --health-retries 30
          --tmpfs /var/lib/postgresql/data
    env:
      TERRAFORMA_TEST_DATABASES: "postgresql+asyncpg://terraforma:terraforma@127.0.0.1:5432/terraforma_test"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pytest -n auto -m "db and ${{ matrix.category }}"

  mysql:
    name: mysql (${{ matrix.category }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        category: [accounts, platform, heroes, fights, social]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: terraforma-root
          MYSQL_USER: terraforma
          MYSQL_PASSWORD: terraforma
          MYSQL_DATABASE: terraforma_test
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uterraforma -pterraforma"
          --health-interval 2s --health-retries 60
          --tmpfs /var/lib/mysql
    env:
      TERRAFORMA_TEST_DATABASES: "mysql+aiomysql://terraforma:terraforma@127.0.0.1:3306/terraforma_test"
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Each pytest worker makes its own databases (terraforma_test_gw0, ...): MySQL's
      # test user needs the right to, as docker/mysql-test-init.sql gives it in compose.
      - name: Let the MySQL test user make per-worker databases
        run: |
          python - <<'PY'
          import pymysql
          connection = pymysql.connect(host="127.0.0.1", user="root", password="terraforma-root")
          with connection.cursor() as cursor:
              cursor.execute("GRANT ALL PRIVILEGES ON `terraforma\\_test\\_%`.* TO 'terraforma'@'%'")
          connection.close()
          PY
      - run: pytest -n auto -m "db and ${{ matrix.category }}"
